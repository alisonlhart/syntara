# Syntara Node SDK - Action Node Example
# Category: action (domain and API integrations)
# Node Type: http_request (REST/GraphQL/Webhook orchestrator)

# Node identification and taxonomy
nodeType: http_request
category: action  # API integration node
execution_type: container  # Isolated worker pod execution

# Node metadata for UI and discovery
displayName: HTTP Request
icon: globe  # React Flow palette glyph; see NodePaletteIcon in common-definitions.json
description: |
  Non-blocking HTTP/HTTPS API orchestrator with credential injection, response parsing,
  and automatic retry logic. Supports REST, GraphQL, and webhook integrations.
version: 1.0.0
author: Syntara Team
license: MIT

# Input schema - rendered as PatternFly form fields in React canvas
inputs:
  properties:
    url:
      type: string
      description: Target HTTP/HTTPS URL (protocol required)
      pattern: "^https?://[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*(:[0-9]{1,5})?(/.*)?$"
      minLength: 10
      maxLength: 2048
      examples:
        - https://api.github.com/repos/owner/repo/issues
        - https://httpbin.org/post
        - http://internal-service.namespace.svc.cluster.local:8080/health

    method:
      type: string
      description: HTTP method verb
      enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - HEAD
        - OPTIONS
      default: GET

    headers:
      type: object
      description: HTTP request headers (key-value pairs)
      patternProperties:
        "^[a-zA-Z0-9-]+$":  # Valid HTTP header names
          type: string
      examples:
        - Content-Type: application/json
          Accept: application/json
          User-Agent: Syntara-Orchestrator/3.0

    query_parameters:
      type: object
      description: URL query parameters (automatically URL-encoded)
      patternProperties:
        "^[a-zA-Z0-9_-]+$":
          type: string
      examples:
        - page: "1"
          per_page: "100"
          status: active

    body:
      # Request payload - object for JSON, string for raw
      oneOf:
        - type: object
          description: JSON object payload (auto-serialized)
        - type: string
          description: Raw string payload (XML, form data, etc.)
      examples:
        - title: New Issue
          body: Created via Syntara workflow
          labels:
            - automation
            - workflow

    timeout_seconds:
      type: integer
      description: Request timeout (connection + read time)
      minimum: 1
      maximum: 600
      default: 30

    response_format:
      type: string
      description: How to parse response body
      enum:
        - json  # Parse as JSON object
        - text  # Return raw string
        - auto  # Detect from Content-Type header
      default: auto

    follow_redirects:
      type: boolean
      description: Automatically follow HTTP 3xx redirects (up to 10 hops)
      default: true

    verify_ssl:
      type: boolean
      description: Verify SSL/TLS certificates (disable only for dev/testing)
      default: true

    # Typed array input — demonstrates that inputs support typed arrays
    # alongside flat primitives (NodeInputs in common-definitions.json).
    success_status_codes:
      type: array
      description: HTTP status codes treated as success (non-success sets StatusCode > 0)
      items:
        type: integer
        minimum: 100
        maximum: 599
      uniqueItems: true
      default:
        - 200
        - 201
        - 204

    # Dynamic nested object input — arbitrary caller-supplied key/value pairs.
    # Demonstrates support for dynamic nested JSON objects.
    context_vars:
      type: object
      description: Arbitrary caller-supplied variables merged into templated fields
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
      examples:
        - environment: production
          region: us-east-1
          retries_enabled: true

  required:
    - url
    - method

# Credential injection for authenticated API calls.
# Zero-trust: the manifest stores only abstract UUID references (credential_id).
# The execution plane resolves each credential at runtime and injects it via the
# requested mount type — env var, RAM-backed tmpfs_file, or HTTP header — before
# the container starts. A node may declare multiple simultaneous references here
# (each a CredentialReference); the shape is defined once, canonically, in
# common-definitions.json.
credential_references:
  - $ref: "../common-definitions.json#/definitions/CredentialReference"

# Output schema - references AND extends StandardOutputWrapper from
# common-definitions.json. The outer envelope (Result/StatusCode/StatusMessage/
# ErrorMessage) is inherited immutably via allOf; the inner Result object is
# described here so the canvas can render downstream template autocompletion
# (e.g. ${http_call.Result.body}, ${http_call.Result.status_code}).
outputs:
  allOf:
    - $ref: "../common-definitions.json#/definitions/StandardOutputWrapper"
  properties:
    Result:
      type: object
      description: HTTP response detail for a completed request. Null on transport failure.
      properties:
        status_code:
          type: integer
          description: HTTP response status code (e.g. 200, 404, 500).
          minimum: 100
          maximum: 599
        headers:
          type: object
          description: Response headers as string key-value pairs.
        body:
          description: Parsed JSON body, or raw text when the response is not JSON.
        elapsed_ms:
          type: integer
          description: Wall-clock request duration in milliseconds.
          minimum: 0
        url:
          type: string
          description: Final URL after any followed redirects.
      required:
        - status_code
        - headers
        - body
        - elapsed_ms
        - url

# Execution metadata and scheduling controls
metadata:
  # Workload security classification
  workload_classification: action  # Can access API credentials

  # Kubernetes resource requirements (I/O-bound, minimal CPU/memory)
  resource_requirements:
    limits:
      cpu: 500m      # 0.5 CPU cores max
      memory: 256Mi  # 256 MiB max
    requests:
      cpu: 100m      # 0.1 CPU cores guaranteed
      memory: 128Mi  # 128 MiB guaranteed

  # Maximum execution duration (including retries)
  execution_timeout: 60  # 1 minute total

  # Pod placement and network controls.
  # connectivity_requirements is the declared egress allowlist the scheduler
  # compiles into a restrictive OpenShift NetworkPolicy before the pod runs.
  scheduling_controls:
    # No affinity labels needed (standard worker pool).
    affinity_labels: []

    # Network egress requirements (NetworkPolicy allowlist).
    # The scheduler auto-extracts the hostname from the resolved 'url' input and
    # adds it to this list at compile time. Declare additional endpoints here
    # only when the request fans out to extra hosts (e.g. redirects, OAuth
    # token endpoints). Any undeclared destination is denied by the policy.
    # Entries may be bare destination strings or {host, ports[]} objects that
    # scope egress to specific ports for a tighter NetworkPolicy rule.
    connectivity_requirements:
      - host: oauth2.googleapis.com  # OAuth token endpoint for bearer-token auth
        ports:
          - port: 443
            protocol: TCP

  # Platform version and capability requirements
  dependencies:
    platformVersion: ">=3.0.0"
    capabilities:
      - network-egress             # Required for external HTTP requests
      - readonly-root-filesystem   # Pod root FS is immutable; nothing writes to disk
      - tmpfs-mount                # RAM-backed scratch + injected credential files

  # Automatic retry on transient HTTP failures
  retry_policy:
    max_attempts: 3
    initial_interval_seconds: 5
    backoff_coefficient: 2.0  # Exponential backoff: 5s, 10s, 20s
    retryable_status_codes:
      - 429  # Rate limit
      - 500  # Internal server error
      - 502  # Bad gateway
      - 503  # Service unavailable
      - 504  # Gateway timeout

  # User-defined tags for organization
  tags:
    - integration:rest-api
    - network:external
    - category:action
